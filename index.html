<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon Miam Miam – Maquette</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--sand:#cfbd97;--ink:#000;--panel:#14120e;--line:#2c271d;--text:#f3ecdc;--mute:#9b9078;--ok:#8fbf7a;--bad:#d9755f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--ink);color:var(--text);font:400 15px/1.5 'Bricolage Grotesque',system-ui,sans-serif}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--sand);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ink);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.logo{font-weight:800;font-size:20px;color:var(--sand);letter-spacing:-.5px}
.roles{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.roles button{padding:6px 12px;border:1px solid var(--line);border-radius:99px;color:var(--mute)}
.roles button.on{background:var(--sand);color:var(--ink);border-color:var(--sand);font-weight:600}
.shell{max-width:980px;margin:0 auto;padding:16px 16px 90px}
.tabs{display:flex;gap:4px;overflow-x:auto;margin-bottom:20px;border-bottom:1px solid var(--line)}
.tabs button{padding:10px 14px;color:var(--mute);white-space:nowrap;border-bottom:2px solid transparent}
.tabs button.on{color:var(--sand);border-color:var(--sand)}
h1{font-size:34px;font-weight:800;letter-spacing:-1px;line-height:1.1;margin-bottom:6px}
h2{font-size:20px;font-weight:600;margin:24px 0 10px}
p.sub{color:var(--mute);max-width:60ch}
.hero{background:var(--sand);color:var(--ink);border-radius:18px;padding:28px;margin:8px 0 20px}
.hero h1{font-size:40px}.hero p{max-width:46ch;margin-bottom:16px}
.btn{background:var(--ink);color:var(--sand);padding:10px 18px;border-radius:10px;font-weight:600}
.btn.alt{background:var(--sand);color:var(--ink)}
.btn.ghost{border:1px solid var(--line);color:var(--text)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.card .pic{height:84px;border-radius:8px;background:repeating-linear-gradient(45deg,#1d1910,#1d1910 8px,#241f14 8px,#241f14 16px);margin-bottom:10px;display:grid;place-items:center;color:var(--mute);font-size:12px}
.price{color:var(--sand);font-weight:600}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.tag{font-size:12px;padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--mute)}
.tag.ok{color:var(--ok);border-color:var(--ok)}.tag.bad{color:var(--bad);border-color:var(--bad)}.tag.sand{color:var(--sand);border-color:var(--sand)}
label{display:block;color:var(--mute);font-size:13px;margin:12px 0 4px}
input,select{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:10px 12px;border-radius:10px;font:inherit}
.form{max-width:400px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.two{grid-template-columns:1fr}h1{font-size:28px}.hero h1{font-size:30px}}
.big{font-size:44px;font-weight:800;color:var(--sand);line-height:1}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--sand)}
.chart{display:flex;align-items:flex-end;gap:8px;height:130px}
.chart div{flex:1;background:var(--sand);border-radius:4px 4px 0 0;position:relative}
.chart span{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:11px;color:var(--mute)}
.cart{position:fixed;left:0;right:0;bottom:0;background:var(--sand);color:var(--ink);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:none;justify-content:space-between;align-items:center;font-weight:600}
.cart button{background:var(--ink);color:var(--sand);padding:8px 16px;border-radius:10px}
.cookie{position:fixed;left:12px;right:12px;bottom:12px;max-width:520px;background:var(--panel);border:1px solid var(--sand);border-radius:12px;padding:14px;z-index:9}
.cookie .acts{display:flex;gap:8px;margin-top:10px}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--sand);color:var(--ink);padding:8px 16px;border-radius:99px;font-weight:600;z-index:10;display:none}
.note{font-size:12px;color:var(--mute);margin-top:30px;border-top:1px solid var(--line);padding-top:10px}
</style>
</head>
<body>
<div class="top"><span class="logo">Mon Miam Miam</span>
<div class="roles" id="roles"></div></div>
<div class="shell"><div class="tabs" id="tabs"></div><main id="view"></main>
<p class="note">Maquette interactive v1.0 – ZeDuc@Space. Primaire #cfbd97, secondaire #000000. Données fictives.</p></div>
<div class="cart" id="cart"><span id="cartInfo"></span><button onclick="go('cmd')">Voir le panier</button></div>
<div class="toast" id="toast"></div>
<div class="cookie" id="cookie"><b>Cookies</b><p class="sub">Nous utilisons des cookies pour mémoriser votre session et améliorer l'application. Acceptez-vous leur utilisation ?</p>
<div class="acts"><button class="btn alt" onclick="cookie.remove()">Accepter</button><button class="btn ghost" onclick="cookie.remove()">Refuser</button></div></div>

<script>
const $=s=>document.querySelector(s);
const MENU=[['Poulet DG',2500],['Ndolé & plantain',2000],['Poisson braisé',3000],['Riz sauce tomate',1500],['Brochettes',1000],['Jus de bissap',500]];
const NAV={
 etu:[['home','Accueil'],['auth','Connexion'],['cmd','Commande'],['fid','Fidélité & parrainage'],['hist','Historique'],['rec','Réclamation'],['jeux','Jeux'],['top','Top 10']],
 emp:[['eco','Commandes'],['emenu','Menu du jour'],['erec','Réclamations'],['estat','Stats semaine']],
 ger:[['gsup','Supervision'],['gemp','Comptes employés'],['gstat','Statistiques'],['grec','Réclamations']],
 adm:[['aemp','Employés'],['amenu','Menu'],['astat','Stats temps réel'],['apromo','Promotions'],['arec','Réclamations'],['aset','Paramètres']]
};
const ROLES={etu:'Étudiant',emp:'Employé',ger:'Gérant',adm:'Admin'};
let role='etu',page='home',cart={},pts=42;

function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',1800)}
function setRole(r){role=r;page=NAV[r][0][0];draw()}
function go(p){page=p;draw()}
function add(i){cart[i]=(cart[i]||0)+1;toast(MENU[i][0]+' ajouté');draw(true)}
function total(){return Object.entries(cart).reduce((s,[i,q])=>s+MENU[i][1]*q,0)}
const f=n=>n.toLocaleString('fr-FR')+' F';

function menuGrid(){return '<div class="grid">'+MENU.map((m,i)=>`<div class="card"><div class="pic">photo du plat</div><b>${m[0]}</b><div class="row" style="border:0;padding:6px 0 0"><span class="price">${f(m[1])}</span><button class="btn alt" onclick="add(${i})">Ajouter</button></div></div>`).join('')+'</div>'}
function chart(v,l){const m=Math.max(...v);return '<div class="chart" style="margin-bottom:26px">'+v.map((x,i)=>`<div style="height:${x/m*100}%"><span>${l[i]}</span></div>`).join('')+'</div>'}
function kpis(a){return '<div class="grid">'+a.map(k=>`<div class="card"><div class="big">${k[0]}</div><p class="sub">${k[1]}</p></div>`).join('')+'</div>'}
function rows(a){return '<div class="card">'+a.map(r=>`<div class="row"><div><b>${r[0]}</b><div class="sub">${r[1]}</div></div><div>${r[2]||''}</div></div>`).join('')+'</div>'}
const W=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];

const V={
home:()=>`<div class="hero"><h1>Le miam miam du jour,<br>tout en haut de la résidence.</h1><p>Commandez sur place ou en livraison, cumulez des points et parrainez vos amis.</p><button class="btn" onclick="go('cmd')">Commander</button></div>
<h2>Menu du jour</h2>${menuGrid()}
<h2>Promotions et événements</h2><div class="grid"><div class="card"><div class="pic">affiche</div><b>-20 % sur les brochettes</b><p class="sub">Jusqu'à vendredi</p></div><div class="card"><div class="pic">affiche</div><b>Soirée Champions League</b><p class="sub">Mardi 21h, écran Canal+</p></div><div class="card"><div class="pic">affiche</div><b>Tournoi de billard</b><p class="sub">Samedi 16h, 500 pts à gagner</p></div></div>`,
auth:()=>`<h1>Connexion</h1><p class="sub">Retrouvez vos commandes et vos points.</p><div class="form"><label>Email</label><input placeholder="etudiant@ucac-icam.com"><label>Mot de passe</label><input type="password" placeholder="Au moins 1 majuscule et 1 chiffre"><p style="margin:12px 0"><a href="#" style="color:var(--sand)" onclick="toast('Lien de récupération envoyé');return false">Mot de passe oublié ?</a></p><button class="btn alt" onclick="go('home');toast('Connecté')">Se connecter</button></div>
<h2>Créer un compte</h2><div class="form"><div class="two"><div><label>Nom</label><input placeholder="Nom complet"></div><div><label>Téléphone</label><input placeholder="6 XX XX XX XX"></div></div><label>Email</label><input><label>Mot de passe</label><input type="password"><label>Localisation de livraison</label><input placeholder="Résidence, chambre"><label>Code de parrainage (facultatif)</label><input placeholder="MIAM-XXXX"><br><br><button class="btn alt" onclick="toast('Compte créé')">Créer mon compte</button></div>`,
cmd:()=>{const t=total(),e=Object.keys(cart);return `<h1>Votre commande</h1>`+(e.length?`<div class="card" style="margin:14px 0">${e.map(i=>`<div class="row"><span>${cart[i]} × ${MENU[i][0]}</span><span class="price">${f(MENU[i][1]*cart[i])}</span></div>`).join('')}</div>
<div class="two"><div><label>Mode de service</label><select><option>Sur place</option><option>Livraison</option></select></div><div><label>Heure d'arrivée</label><input type="time" value="12:30"></div></div>
<label>Points de fidélité à utiliser (${pts} dispo, 15 pts = 1 000 F)</label><select id="usep"><option value="0">Aucun</option><option value="15">15 pts (-1 000 F)</option><option value="30">30 pts (-2 000 F)</option></select>
<label>Paiement</label><select><option>Mobile money</option><option>Carte bancaire</option></select>
<h2>Total : <span class="price">${f(t)}</span></h2><button class="btn alt" onclick="cart={};go('hist');toast('Commande confirmée, +'+Math.floor(${t}/1000)+' pts')">Payer et confirmer</button>`:`<p class="sub" style="margin:10px 0 20px">Votre panier est vide. Choisissez un plat pour commencer.</p>`+menuGrid())},
fid:()=>`<h1>Fidélité & parrainage</h1><div class="card" style="margin:14px 0"><div class="big">${pts} pts</div><p class="sub">1 000 F dépensés = 1 point. 15 points = 1 000 F de réduction.</p><div class="bar" style="margin:12px 0 4px"><i style="width:${pts/60*100}%"></i></div><p class="sub">Prochain palier : 60 pts</p></div>
<h2>Mon code de parrainage</h2><div class="card"><div class="row" style="border:0"><span class="big" style="font-size:30px">MIAM-7K2D</span><button class="btn alt" onclick="toast('Code copié')">Copier</button></div><p class="sub">Vous gagnez des points quand votre filleul passe sa première commande.</p></div>
<h2>Mes filleuls</h2>${rows([['Brice N.','Inscrit le 02/09','<span class="tag ok">Récompense reçue</span>'],['Aïcha M.','Inscrite le 10/09','<span class="tag">En attente</span>']])}
<h2>Historique des points</h2>${rows([['Commande #1042','+3 pts','12/09'],['Parrainage Brice N.','+5 pts','04/09'],['Réduction utilisée','-15 pts','01/09']])}`,
hist:()=>`<h1>Mes commandes</h1><br>${rows([['Commande #1042 – Poulet DG, jus','6 500 F · livrée','<span class="tag ok">Livrée</span> <button class="btn ghost" onclick="go(\'rec\')">Signaler</button>'],['Commande #1031 – Brochettes ×2','2 000 F · sur place','<span class="tag ok">Servie</span>']])}<h2>Laisser un commentaire</h2><div class="form"><textarea style="width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px;font:inherit" rows="3" placeholder="Votre avis sur la dernière commande"></textarea><br><br><button class="btn alt" onclick="toast('Commentaire envoyé')">Envoyer</button></div>`,
rec:()=>`<h1>Réclamation</h1><div class="form"><label>Commande concernée</label><select><option>#1042</option><option>#1031</option></select><label>Problème</label><select><option>Plat manquant</option><option>Retard de livraison</option><option>Erreur de montant</option></select><label>Détails</label><input placeholder="Expliquez en une phrase"><br><br><button class="btn alt" onclick="toast('Réclamation envoyée')">Envoyer</button></div><h2>Suivi</h2>${rows([['#1042 – Plat manquant','Envoyée le 13/09','<span class="tag sand">En cours</span>']])}`,
jeux:()=>`<h1>Jeux et événements</h1><div class="grid" style="margin-top:14px"><div class="card"><div class="pic">mini-jeu</div><b>Roue du miam</b><p class="sub">Un tour par jour, jusqu'à 20 pts.</p><br><button class="btn alt" onclick="pts+=5;toast('+5 points gagnés')">Tourner</button></div><div class="card"><div class="pic">quiz</div><b>Quiz football</b><p class="sub">Gagnez une boisson offerte.</p><br><button class="btn alt" onclick="toast('Quiz bientôt disponible')">Jouer</button></div></div>`,
top:()=>`<h1>Les 10 meilleurs clients</h1><div class="form" style="margin:14px 0"><select><option>Cette semaine</option><option>Aujourd'hui</option><option>Ce mois</option></select></div>${rows(['Carine T.','Jordan K.','Yannick B.','Sandra E.','Moussa D.','Lionel F.','Estelle P.','Parfait A.','Nadia O.','Ghislain R.'].map((n,i)=>[`${i+1}. ${n}`,'',`<b class="price">${24-i*2} commandes</b>`]))}`,

eco:()=>`<h1>Commandes en cours</h1><br>${rows([['#1050 – Poulet DG ×2','Sur place, 12:30','<button class="btn alt" onclick="toast(\'Commande validée\')">Valider</button>'],['#1051 – Poisson braisé','Livraison, résidence B','<button class="btn alt" onclick="toast(\'Commande validée\')">Valider</button>'],['#1052 – Brochettes ×3','Sur place, 13:00','<button class="btn alt" onclick="toast(\'Commande validée\')">Valider</button>']])}`,
emenu:()=>`<h1>Menu du jour</h1><p class="sub">Modifications temporaires : plat épuisé ou plat du jour.</p><br>${rows(MENU.map((m,i)=>[m[0],f(m[1]),`<button class="btn ${i==2?'ghost':'alt'}" onclick="toast('Disponibilité mise à jour')">${i==2?'Épuisé':'Disponible'}</button>`]))}`,
erec:()=>`<h1>Réclamations</h1><br>${rows([['#1042 – Plat manquant','Brice N.','<button class="btn alt" onclick="toast(\'Réponse proposée au gérant\')">Répondre</button>'],['#1038 – Retard','Aïcha M.','<span class="tag ok">Traitée</span>']])}`,
estat:()=>`<h1>Ventes de la semaine</h1><br>${chart([42,38,55,47,70,88,60],W)}${kpis([['342','commandes'],['612 000 F','chiffre d\'affaires']])}`,
gsup:()=>`<h1>Supervision en temps réel</h1><br>${kpis([['7','en préparation'],['3','en livraison'],['18','servies aujourd\'hui']])}<h2>Flux</h2>${rows([['#1052','Brochettes ×3','<span class="tag sand">Préparation</span>'],['#1051','Poisson braisé','<span class="tag sand">Livraison</span>'],['#1050','Poulet DG ×2','<span class="tag ok">Servie</span>']])}`,
gemp:()=>`<h1>Comptes employés</h1><br>${rows([['Éric M.','Cuisine','<span class="tag ok">Actif</span>'],['Laure N.','Service','<span class="tag ok">Actif</span>']])}<h2>Ajouter un employé</h2><div class="form"><label>Nom</label><input><label>Email</label><input><br><br><button class="btn alt" onclick="toast('Employé créé')">Créer le compte</button></div>`,
gstat:()=>`<h1>Statistiques générales</h1><br>${chart([320,290,410,380],['S1','S2','S3','S4'])}${kpis([['1 120','commandes ce mois'],['38 %','paient avec des points'],['64','parrainages réussis']])}`,
grec:()=>`<h1>Réclamations à valider</h1><br>${rows([['#1042 – Plat manquant','Réponse employé : remboursement 2 500 F','<button class="btn alt" onclick="toast(\'Réponse validée\')">Valider</button> <button class="btn ghost" onclick="toast(\'Réponse rejetée\')">Rejeter</button>']])}`,
aemp:()=>V.gemp().replace('Comptes employés','Gestion des employés').replace('Créer le compte','Créer le compte').replace('<span class="tag ok">Actif</span>','<button class="btn ghost" onclick="toast(\'Compte supprimé\')">Supprimer</button>'),
amenu:()=>`<h1>Gestion du menu</h1><br>${rows(MENU.map(m=>[m[0],f(m[1]),'<button class="btn ghost" onclick="toast(\'Modification enregistrée\')">Modifier</button> <button class="btn ghost" onclick="toast(\'Plat supprimé\')">Supprimer</button>']))}<br><button class="btn alt" onclick="toast('Plat ajouté')">Ajouter un plat</button>`,
astat:()=>`<h1>Statistiques en temps réel</h1><br>${chart([22,35,60,48,72,90,55],['10h','11h','12h','13h','14h','15h','16h'])}${kpis([['94 500 F','ventes du jour'],['41','commandes'],['12','codes de parrainage utilisés']])}`,
apromo:()=>`<h1>Promotions et événements</h1><p class="sub">Les offres et jeux sont publiés sous forme d'affiches.</p><div class="form"><label>Titre</label><input placeholder="Soirée Champions League"><label>Affiche</label><input type="file"><label>Type</label><select><option>Promotion</option><option>Événement</option><option>Jeu</option></select><br><br><button class="btn alt" onclick="toast('Affiche publiée')">Publier</button></div>`,
arec:()=>V.grec().replace('Réclamations à valider','Suivi des réclamations'),
aset:()=>`<h1>Paramètres</h1><div class="form"><label>Heures d'ouverture</label><input value="10:00 – 23:00"><label>Points gagnés pour 1 000 F</label><input value="1"><label>Points pour 1 000 F de réduction</label><input value="15"><label>Validité des points (mois)</label><input value="12"><br><br><button class="btn alt" onclick="toast('Paramètres enregistrés')">Enregistrer</button></div>`
};

function draw(keep){
 $('#roles').innerHTML=Object.entries(ROLES).map(([k,v])=>`<button class="${k==role?'on':''}" onclick="setRole('${k}')">${v}</button>`).join('');
 $('#tabs').innerHTML=NAV[role].map(([k,v])=>`<button class="${k==page?'on':''}" onclick="go('${k}')">${v}</button>`).join('');
 $('#view').innerHTML=V[page]();
 const n=Object.values(cart).reduce((a,b)=>a+b,0);
 $('#cart').style.display=(role=='etu'&&n&&page!='cmd')?'flex':'none';
 $('#cartInfo').textContent=n+' article(s) · '+f(total());
 if(!keep)scrollTo(0,0);
}
draw();
</script>
</body>
</html>
